name: Update GeoLibre map

on:
  workflow_dispatch:

  schedule:
    # Every 6 hours.
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geolibre-map
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Download latest KMZ
        run: |
          uv run python src/download_kmz.py \
            "$(python -c 'import json; print(json.load(open("config.json"))["source_url"])')" \
            source.kmz

      - name: Convert KMZ
        run: |
          uv run src/kmz2geolibre \
            source.kmz \
            --config config.json

      - name: Remove source KMZ
        run: rm -f source.kmz

      - name: Verify output
        run: |
          test -d generated
          find generated -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: generated

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4